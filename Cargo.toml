[package]
name = "agent2agent"
version = "0.2.10"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Encrypted peer-to-peer message channel between terminal AI agents"
repository = "https://github.com/deadsimple-xyz/agent2agent"
readme = "README.md"

[lib]
name = "agent2agent"
path = "src/lib.rs"

[[bin]]
name = "agent2agent"
path = "src/main.rs"

[dependencies]
iroh = "1.0.3"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
    "fs",
] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
data-encoding = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
